name: Publish launcher update
on:
  push:
    branches: [main]
    paths: ['client/**', 'scripts/package-release.py', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: launcher-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package compiled client
        id: package
        run: echo "version=$(python3 scripts/package-release.py)" >> "$GITHUB_OUTPUT"
      - name: Publish release asset and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "Fire-Tail-Client-$VERSION.zip" channel.json --clobber
          else
            gh release create "v$VERSION" "Fire-Tail-Client-$VERSION.zip" channel.json --title "FIRE TAIL $VERSION" --notes-file RELEASE_NOTES.md
          fi
      - name: Update launcher feed after release upload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channel.json
          if ! git diff --cached --quiet; then
            git commit -m "Update launcher feed"
            git push origin HEAD:main
          fi
